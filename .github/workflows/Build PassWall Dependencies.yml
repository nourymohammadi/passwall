name: Build PassWall Dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Download and Extract OpenWrt Snapshot SDK
        run: |
          # Dynamically fetch the latest SDK tarball for mvebu/cortexa9
          SDK_FILE=$(curl -s https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa9/sha256sums | grep "openwrt-sdk" | awk '{print $2}')
          wget "https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa9/${SDK_FILE}" -O sdk.tar.xz
          mkdir sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1

      - name: Add PassWall Packages Feed
        working-directory: sdk
        run: |
          echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure SDK for Packages
        working-directory: sdk
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_tcping=m" >> .config
          echo "CONFIG_PACKAGE_geoview=m" >> .config
          make defconfig

      - name: Compile tcping and geoview
        working-directory: sdk
        run: |
          make package/tcping/compile V=s
          make package/geoview/compile V=s

      - name: Collect Compiled APKs
        run: |
          mkdir out_packages
          find sdk/bin/packages/ -name "*tcping*.apk" -exec cp {} out_packages/ \;
          find sdk/bin/packages/ -name "*geoview*.apk" -exec cp {} out_packages/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passwall-apk-packages
          path: out_packages/*.apk
